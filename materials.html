<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Материалы · Математика с Полиной</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F1EBE9;
            color: #000000;
            min-height: 100vh;
            padding-top: 70px;
        }

        /* ===== ШАПКА С БУРГЕРОМ ===== */
        .navbar {
            background: #ffffff;
            padding: 0.6rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border-bottom: 3px solid #FBC5D9;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            min-height: 60px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #FBC5D9;
            box-shadow: 0 4px 12px rgba(141,11,13,0.15);
            transition: transform 0.2s;
        }
        .nav-avatar:hover { transform: scale(1.05); }

        .nav-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: #8D0B0D;
            letter-spacing: -0.02em;
        }
        .nav-title span { font-weight: 400; color: #555; }

        .burger-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.8rem;
            color: #8D0B0D;
            cursor: pointer;
            padding: 0.3rem;
            transition: 0.3s;
        }
        .burger-btn:hover { transform: scale(1.1); }

        .nav-menu {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        .nav-menu a {
            text-decoration: none;
            color: #000000;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.5rem 0.2rem;
            border-bottom: 3px solid transparent;
            transition: 0.25s;
        }
        .nav-menu a:hover,
        .nav-menu a.active {
            border-bottom-color: #8D0B0D;
            color: #8D0B0D;
        }
        .nav-menu a i { margin-right: 6px; }

        .admin-controls {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .admin-btn {
            background: #8D0B0D;
            color: #FFFFFF;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .admin-btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        .admin-btn.logout {
            background: #555;
        }
        .admin-btn.logout:hover { background: #333; }
        .admin-status {
            font-size: 0.75rem;
            color: #27ae60;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .page-header {
            padding: 2rem 4rem 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            color: #8D0B0D;
        }
        .page-header h1 i { margin-right: 10px; }

        .btn-primary {
            background: #8D0B0D;
            color: #FFFFFF;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            transition: 0.25s;
            box-shadow: 0 8px 20px rgba(141,11,13,0.2);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(141,11,13,0.35);
        }

        /* ===== КАТАЛОГ-ПАПКИ (ДВЕ КОЛОНКИ) ===== */
        .catalog {
            max-width: 1100px;
            margin: 1.5rem auto;
            padding: 0 2rem 3rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .folder-item {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 0 #d0c8c4, 0 6px 16px rgba(0,0,0,0.04);
            border: 1px solid #e8e0dc;
            overflow: hidden;
            transition: 0.3s;
            align-self: start;
        }
        .folder-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #d0c8c4, 0 10px 24px rgba(0,0,0,0.06);
        }

        .folder-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }
        .folder-header:hover {
            background: #faf8f7;
        }
        .folder-header .folder-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .folder-header .folder-icon {
            font-size: 1.8rem;
            color: #8D0B0D;
            width: 2.5rem;
            text-align: center;
        }
        .folder-header .folder-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a2639;
        }
        .folder-header .folder-count {
            font-size: 0.8rem;
            color: #999;
            background: #f1ebe9;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }
        .folder-header .folder-arrow {
            color: #999;
            transition: transform 0.3s;
            font-size: 1.2rem;
        }
        .folder-header .folder-arrow.open {
            transform: rotate(90deg);
        }

        .folder-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
            padding: 0 1.5rem;
        }
        .folder-content.open {
            max-height: 600px;
            padding: 0 1.5rem 1rem;
        }

        .folder-content .material-link {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem 1rem;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            font-size: 0.95rem;
            transition: 0.2s;
            border-left: 3px solid transparent;
        }
        .folder-content .material-link:hover {
            background: #faf8f7;
            border-left-color: #8D0B0D;
            color: #8D0B0D;
        }
        .folder-content .material-link i {
            color: #8D0B0D;
            width: 1.5rem;
            text-align: center;
            font-size: 1rem;
        }
        .folder-content .material-link .link-class {
            font-size: 0.7rem;
            color: #999;
            background: #f1ebe9;
            padding: 0.05rem 0.6rem;
            border-radius: 40px;
            margin-left: auto;
            font-weight: 600;
        }

        .empty-folder {
            color: #999;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            font-style: italic;
        }

        .footer {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 0.85rem;
            border-top: 2px solid #FBC5D9;
            margin-top: 1rem;
            background: rgba(255, 255, 255, 0.5);
        }

        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #ffffff;
            border-radius: 32px;
            padding: 2.5rem;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .modal-box h2 {
            font-family: 'Playfair Display', serif;
            color: #8D0B0D;
            margin-bottom: 0.5rem;
        }
        .modal-box p { color: #666; margin-bottom: 1.5rem; }
        .modal-box input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            border: 2px solid #e0d8d4;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            margin-bottom: 1rem;
        }
        .modal-box input:focus { outline: none; border-color: #8D0B0D; }
        .modal-box .modal-actions {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
        }
        .modal-box .modal-actions button {
            padding: 0.6rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-box .modal-actions .btn-confirm {
            background: #8D0B0D;
            color: #fff;
        }
        .modal-box .modal-actions .btn-confirm:hover { background: #a93226; }
        .modal-box .modal-actions .btn-cancel {
            background: #e0d8d4;
            color: #333;
        }
        .modal-box .modal-actions .btn-cancel:hover { background: #ccc; }
        .modal-box .error-msg {
            color: #c0392b;
            font-size: 0.85rem;
            margin-bottom: 0.8rem;
            display: none;
        }
        .modal-box .error-msg.show { display: block; }

        .admin-only {
            display: none !important;
        }
        .admin-only.show {
            display: inline-flex !important;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            body { padding-top: 55px; }
            .navbar {
                padding: 0.4rem 1rem;
                min-height: 50px;
            }
            .nav-avatar {
                width: 36px;
                height: 36px;
            }
            .nav-title {
                font-size: 1.1rem;
            }
            .nav-title span {
                display: none;
            }

            .burger-btn {
                display: block;
            }

            .nav-menu {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: #ffffff;
                flex-direction: column;
                padding: 1rem;
                gap: 0.5rem;
                border-bottom: 3px solid #FBC5D9;
                box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            }
            .nav-menu.open {
                display: flex;
            }
            .nav-menu a {
                font-size: 0.9rem;
                padding: 0.5rem 0;
                width: 100%;
                text-align: center;
                border-bottom: 1px solid #f0ecea;
            }
            .nav-menu a:last-child {
                border-bottom: none;
            }

            .admin-controls {
                gap: 0.4rem;
            }
            .admin-controls .admin-btn {
                font-size: 0.65rem;
                padding: 0.2rem 0.6rem;
            }
            .admin-status {
                font-size: 0.6rem;
            }

            .page-header {
                padding: 1.5rem;
                flex-direction: column;
                align-items: flex-start;
            }
            .catalog {
                padding: 0 1rem 2rem;
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .folder-header {
                padding: 0.8rem 1rem;
            }
            .folder-header .folder-name {
                font-size: 1.1rem;
            }
            .folder-content {
                padding: 0 1rem;
            }
            .folder-content.open {
                padding: 0 1rem 0.8rem;
            }
            .admin-controls {
                width: 100%;
                justify-content: flex-end;
            }
        }

        @media (max-width: 480px) {
            body { padding-top: 48px; }
            .nav-title { font-size: 0.9rem; }
            .nav-avatar { width: 30px; height: 30px; }
            .burger-btn { font-size: 1.5rem; }
            .folder-header .folder-name {
                font-size: 1rem;
            }
            .folder-content .material-link {
                font-size: 0.85rem;
                padding: 0.5rem 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ШАПКА С БУРГЕР-МЕНЮ ===== -->
    <nav class="navbar" id="navbar">
        <div class="nav-left">
            <img src="images/avatar.png" alt="Полина" class="nav-avatar" />
            <span class="nav-title">Математика <span>с Полиной</span></span>
        </div>

        <button class="burger-btn" id="burgerBtn" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
        </button>

        <div class="nav-menu" id="navMenu">
            <a href="index.html"><i class="fas fa-home"></i> Главная</a>
            <a href="tests.html"><i class="fas fa-tasks"></i> Тесты</a>
            <a href="materials.html" class="active"><i class="fas fa-folder-open"></i> Материалы</a>
            <a href="tutoring.html"><i class="fas fa-chalkboard-teacher"></i> Репетиторство</a>
            <a href="contacts.html"><i class="fas fa-envelope"></i> Контакты</a>
        </div>

        <div class="admin-controls">
            <span class="admin-status" id="adminStatus" style="display:none;">
                <i class="fas fa-circle" style="color:#27ae60;"></i> Админ
            </span>
            <button class="admin-btn" id="adminLoginBtn" onclick="showLoginModal()">
                <i class="fas fa-user-shield"></i> Вход
            </button>
            <button class="admin-btn logout" id="adminLogoutBtn" style="display:none;" onclick="logoutAdmin()">
                <i class="fas fa-sign-out-alt"></i> Выйти
            </button>
        </div>
    </nav>

    <!-- ===== МОДАЛЬНОЕ ОКНО ===== -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2><i class="fas fa-user-shield" style="color:#8D0B0D;"></i> Вход для учителя</h2>
            <p>Введите пароль для доступа к управлению материалами</p>
            <div class="error-msg" id="loginError">❌ Неверный пароль. Попробуйте ещё раз.</div>
            <input type="password" id="passwordInput" placeholder="Введите пароль..." onkeydown="if(event.key==='Enter') checkPassword()" />
            <div class="modal-actions">
                <button class="btn-confirm" onclick="checkPassword()">Войти</button>
                <button class="btn-cancel" onclick="closeLoginModal()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
    <div class="page-header">
        <h1><i class="fas fa-folder-open"></i> Материалы</h1>
        <a href="create-material.html" class="btn-primary admin-only" id="createMaterialBtn" style="display:none;">
            <i class="fas fa-plus-circle"></i> Добавить материал
        </a>
    </div>

    <div class="catalog" id="catalogContainer">
        <!-- Загружается динамически -->
    </div>

    <div class="footer">
        &copy; 2026 Математика с Полиной · Сделано с ❤️
    </div>

    <script>
        const ADMIN_PASSWORD = 'polina2026';
        let isAdmin = false;

        // ===== БУРГЕР-МЕНЮ =====
        function toggleMenu() {
            const menu = document.getElementById('navMenu');
            const burger = document.getElementById('burgerBtn');
            menu.classList.toggle('open');
            if (menu.classList.contains('open')) {
                burger.innerHTML = '<i class="fas fa-times"></i>';
            } else {
                burger.innerHTML = '<i class="fas fa-bars"></i>';
            }
        }

        document.querySelectorAll('#navMenu a').forEach(link => {
            link.addEventListener('click', function() {
                document.getElementById('navMenu').classList.remove('open');
                document.getElementById('burgerBtn').innerHTML = '<i class="fas fa-bars"></i>';
            });
        });

        document.addEventListener('click', function(event) {
            const navbar = document.getElementById('navbar');
            const menu = document.getElementById('navMenu');
            const burger = document.getElementById('burgerBtn');
            if (!navbar.contains(event.target)) {
                menu.classList.remove('open');
                burger.innerHTML = '<i class="fas fa-bars"></i>';
            }
        });

        // ===== ДАННЫЕ МАТЕРИАЛОВ (НОВАЯ СТРУКТУРА С ПАПКАМИ) =====
        const foldersData = [
            {
                name: 'Тренажёры',
                icon: 'fa-brain',
                items: [
                    { name: 'Числовой тренажёр «Операции с отрицательными числами»', link: 'trainer.html', class: '6' },
                    { name: 'Действия с обыкновенными дробями (5 класс)', link: 'trainer-fractions.html', class: '5' },
                    { name: 'Действия с десятичными дробями', link: 'trainer-decimals.html', class: '5' }
                ]
            },
            {
                name: 'Онлайн-игры',
                icon: 'fa-gamepad',
                items: [
                    // Пока пусто, но можно добавить позже
                ]
            }
        ];

        // ===== ОТОБРАЖЕНИЕ КАТАЛОГА =====
        function renderCatalog() {
            const container = document.getElementById('catalogContainer');
            let html = '';

            foldersData.forEach((folder, folderIndex) => {
                const hasItems = folder.items && folder.items.length > 0;
                const itemCount = hasItems ? folder.items.length : 0;

                html += `
                    <div class="folder-item">
                        <div class="folder-header" onclick="toggleFolder(this, ${folderIndex})">
                            <div class="folder-left">
                                <span class="folder-icon"><i class="fas ${folder.icon}"></i></span>
                                <span class="folder-name">${folder.name}</span>
                                ${itemCount > 0 ? `<span class="folder-count">${itemCount}</span>` : ''}
                            </div>
                            <span class="folder-arrow"><i class="fas fa-chevron-right"></i></span>
                        </div>
                        <div class="folder-content" id="folderContent-${folderIndex}">
                            ${hasItems ? folder.items.map(item => `
                                <a href="${item.link}" class="material-link">
                                    <i class="fas fa-file-alt"></i>
                                    ${item.name}
                                    <span class="link-class">${item.class} класс</span>
                                </a>
                            `).join('') : `
                                <div class="empty-folder">Пока нет материалов</div>
                            `}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ===== ПЕРЕКЛЮЧЕНИЕ ПАПКИ =====
        let openFolderIndex = null;

        function toggleFolder(headerElement, folderIndex) {
            const content = document.getElementById(`folderContent-${folderIndex}`);
            const arrow = headerElement.querySelector('.folder-arrow');

            // Если эта папка уже открыта — закрываем её
            if (openFolderIndex === folderIndex) {
                content.classList.remove('open');
                arrow.classList.remove('open');
                openFolderIndex = null;
                return;
            }

            // Закрываем предыдущую открытую папку
            if (openFolderIndex !== null) {
                const prevContent = document.getElementById(`folderContent-${openFolderIndex}`);
                const prevArrow = prevContent?.parentElement?.querySelector('.folder-arrow');
                if (prevContent) prevContent.classList.remove('open');
                if (prevArrow) prevArrow.classList.remove('open');
            }

            // Открываем новую
            content.classList.add('open');
            arrow.classList.add('open');
            openFolderIndex = folderIndex;
        }

        // ===== АДМИН =====
        function checkAdminStatus() {
            const saved = localStorage.getItem('polina_admin');
            if (saved === 'true') {
                isAdmin = true;
                document.getElementById('adminStatus').style.display = 'inline';
                document.getElementById('adminLoginBtn').style.display = 'none';
                document.getElementById('adminLogoutBtn').style.display = 'inline-flex';
                document.getElementById('createMaterialBtn').style.display = 'inline-flex';
                document.getElementById('createMaterialBtn').classList.add('show');
            } else {
                isAdmin = false;
                document.getElementById('adminStatus').style.display = 'none';
                document.getElementById('adminLoginBtn').style.display = 'inline-flex';
                document.getElementById('adminLogoutBtn').style.display = 'none';
                document.getElementById('createMaterialBtn').style.display = 'none';
                document.getElementById('createMaterialBtn').classList.remove('show');
            }
        }

        function showLoginModal() {
            document.getElementById('loginModal').classList.add('show');
            document.getElementById('passwordInput').value = '';
            document.getElementById('loginError').classList.remove('show');
            setTimeout(() => document.getElementById('passwordInput').focus(), 100);
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('show');
        }

        function checkPassword() {
            const input = document.getElementById('passwordInput');
            if (input.value === ADMIN_PASSWORD) {
                isAdmin = true;
                localStorage.setItem('polina_admin', 'true');
                closeLoginModal();
                checkAdminStatus();
            } else {
                document.getElementById('loginError').classList.add('show');
                input.value = '';
                input.focus();
            }
        }

        function logoutAdmin() {
            if (confirm('Выйти из режима администратора?')) {
                isAdmin = false;
                localStorage.removeItem('polina_admin');
                checkAdminStatus();
            }
        }

        document.getElementById('loginModal').addEventListener('click', function(e) {
            if (e.target === this) closeLoginModal();
        });

        window.addEventListener('DOMContentLoaded', function() {
            renderCatalog();
            checkAdminStatus();
        });
    </script>

</body>
</html>
