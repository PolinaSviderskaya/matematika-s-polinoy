<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Создать тест · Математика с Полиной</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F1EBE9;
            color: #000000;
            min-height: 100vh;
        }

        .navbar {
            background: #ffffff;
            padding: 1rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border-bottom: 3px solid #FBC5D9;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .nav-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #FBC5D9;
            box-shadow: 0 4px 12px rgba(141,11,13,0.15);
            transition: transform 0.2s;
        }
        .nav-avatar:hover { transform: scale(1.05); }
        .nav-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: #8D0B0D;
            letter-spacing: -0.02em;
        }
        .nav-title span { font-weight: 400; color: #555; }
        .nav-menu {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        .nav-menu a {
            text-decoration: none;
            color: #000000;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.5rem 0.2rem;
            border-bottom: 3px solid transparent;
            transition: 0.25s;
        }
        .nav-menu a:hover,
        .nav-menu a.active {
            border-bottom-color: #8D0B0D;
            color: #8D0B0D;
        }
        .nav-menu a i { margin-right: 6px; }

        .constructor-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            padding: 2rem 4rem 3rem;
        }
        @media (max-width: 820px) {
            .constructor-wrapper { grid-template-columns: 1fr; padding: 1.5rem; }
        }

        .form-panel {
            background: #ffffff;
            border-radius: 32px;
            padding: 2rem;
            box-shadow: 0 8px 0 #d0c8c4, 0 12px 28px rgba(0,0,0,0.06);
            border: 1px solid #e8e0dc;
            position: relative;
        }
        .form-panel::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            right: -4px;
            bottom: -4px;
            background: #FBC5D9;
            border-radius: 32px;
            z-index: -1;
            opacity: 0.2;
        }
        .form-panel h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: #8D0B0D;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }
        .input-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }
        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 16px;
            border: 2px solid #e0d8d4;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            background: #faf8f7;
            transition: 0.2s;
        }
        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #8D0B0D;
            background: #ffffff;
        }
        .input-group textarea { resize: vertical; min-height: 60px; }

        .question-types {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }
        .type-btn {
            background: #faf8f7;
            border: 2px solid #e0d8d4;
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .type-btn:hover {
            border-color: #8D0B0D;
            background: #f5f0ee;
        }
        .type-btn.active {
            border-color: #8D0B0D;
            background: #8D0B0D;
            color: #ffffff;
        }
        .type-btn.active i { color: #ffffff; }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 0.6rem;
            min-height: 50px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #faf8f7;
            padding: 0.4rem 0.8rem 0.4rem 0.5rem;
            border-radius: 40px;
            border: 2px solid #e0d8d4;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .option-item input[type="radio"],
        .option-item input[type="checkbox"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #aaa;
            border-radius: 50%;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
        }
        .option-item input[type="checkbox"] {
            border-radius: 4px;
        }
        .option-item input[type="radio"]:checked {
            border-color: #8D0B0D;
            background: #8D0B0D;
            box-shadow: inset 0 0 0 4px #fff, 0 0 0 1px #8D0B0D;
        }
        .option-item input[type="checkbox"]:checked {
            border-color: #8D0B0D;
            background: #8D0B0D;
            box-shadow: inset 0 0 0 3px #fff, 0 0 0 1px #8D0B0D;
        }
        .option-item label {
            font-size: 0.9rem;
            flex: 1;
            cursor: pointer;
            word-break: break-word;
        }
        .option-item .delete-option {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 1rem;
            padding: 0 4px;
            transition: 0.2s;
        }
        .option-item .delete-option:hover {
            color: #8D0B0D;
            transform: scale(1.2);
        }

        .add-option-row {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.3rem;
        }
        .add-option-row input {
            flex: 1;
            padding: 0.6rem 1rem;
            border-radius: 40px;
            border: 2px solid #e0d8d4;
            font-family: 'Inter', sans-serif;
            background: #faf8f7;
        }
        .add-option-row input:focus {
            outline: none;
            border-color: #8D0B0D;
        }
        .btn-small {
            background: #FBC5D9;
            color: #000;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-small:hover {
            background: #f5b2cc;
        }

        .empty-options-hint {
            color: #aaa;
            font-size: 0.85rem;
            padding: 0.5rem 0;
            font-style: italic;
        }

        .image-upload-field {
            background: #faf8f7;
            padding: 1rem;
            border-radius: 16px;
            border: 2px solid #e0d8d4;
            margin-top: 0.3rem;
        }
        .image-upload-field input[type="file"] {
            width: 100%;
            padding: 0.5rem;
            border-radius: 12px;
            border: 2px solid #ddd;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            margin-top: 0.3rem;
            background: #ffffff;
        }
        .image-upload-field .image-hint {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.3rem;
        }
        .image-preview {
            margin-top: 0.5rem;
            max-width: 100%;
            max-height: 150px;
            border-radius: 12px;
            border: 2px solid #e0d8d4;
            display: none;
        }
        .image-preview.show {
            display: block;
        }

        .open-answer-field {
            display: none;
            background: #faf8f7;
            padding: 1rem;
            border-radius: 16px;
            border: 2px solid #e0d8d4;
            margin-top: 0.3rem;
        }
        .open-answer-field.show {
            display: block;
        }
        .open-answer-field input {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            border: 2px solid #ddd;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            margin-top: 0.3rem;
            background: #ffffff;
        }
        .open-answer-field input:focus {
            outline: none;
            border-color: #8D0B0D;
        }

        .file-answer-field {
            display: none;
            background: #faf8f7;
            padding: 1rem;
            border-radius: 16px;
            border: 2px solid #e0d8d4;
            margin-top: 0.3rem;
        }
        .file-answer-field.show {
            display: block;
        }
        .file-answer-field .file-info {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.5rem 1rem;
            background: #eef4ff;
            border-radius: 12px;
            color: #2d3b5e;
        }
        .file-answer-field .file-info i {
            font-size: 1.5rem;
            color: #8D0B0D;
        }

        .btn-primary {
            background: #8D0B0D;
            color: #FFFFFF;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            transition: 0.25s;
            box-shadow: 0 8px 20px rgba(141,11,13,0.2);
            width: 100%;
            justify-content: center;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(141,11,13,0.35);
        }
        .btn-secondary {
            background: #FBC5D9;
            color: #000;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            transition: 0.25s;
            width: 100%;
            justify-content: center;
        }
        .btn-secondary:hover {
            background: #f5b2cc;
            transform: translateY(-3px);
        }
        .action-row {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .action-row .btn-primary,
        .action-row .btn-secondary {
            width: auto;
            flex: 1;
            min-width: 120px;
        }

        .preview-panel {
            background: #ffffff;
            border-radius: 32px;
            padding: 2rem;
            box-shadow: 0 8px 0 #d0c8c4, 0 12px 28px rgba(0,0,0,0.06);
            border: 1px solid #e8e0dc;
            position: relative;
        }
        .preview-panel::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            right: -4px;
            bottom: -4px;
            background: #FBC5D9;
            border-radius: 32px;
            z-index: -1;
            opacity: 0.2;
        }
        .preview-panel h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: #8D0B0D;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .preview-panel .count {
            font-size: 0.8rem;
            background: #FBC5D9;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-weight: 600;
        }
        .preview-question {
            background: #faf8f7;
            border-radius: 20px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid #e8e0dc;
        }
        .preview-question .q-text { font-weight: 600; margin-bottom: 0.5rem; }
        .preview-question .q-image {
            max-width: 100%;
            max-height: 120px;
            border-radius: 12px;
            margin-bottom: 0.5rem;
            border: 1px solid #ddd;
        }
        .preview-question .q-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .preview-question .q-options span {
            background: #ffffff;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            border: 1px solid #ddd;
            font-size: 0.85rem;
        }
        .preview-question .q-options .correct {
            background: #d4e2d4;
            border-color: #8fb08f;
            font-weight: 600;
        }
        .preview-question .q-meta {
            font-size: 0.75rem;
            color: #777;
            margin-top: 0.4rem;
        }
        .preview-question .q-type-badge {
            display: inline-block;
            background: #FBC5D9;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 0.3rem;
        }
        .empty-preview {
            text-align: center;
            padding: 2rem;
            color: #999;
        }
        .empty-preview i {
            font-size: 2.5rem;
            color: #FBC5D9;
            display: block;
            margin-bottom: 0.5rem;
        }
        .footer {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 0.85rem;
            border-top: 2px solid #FBC5D9;
            margin-top: 1rem;
            background: rgba(255, 255, 255, 0.5);
        }
        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 0.8rem; padding: 1rem; }
            .nav-menu { flex-wrap: wrap; justify-content: center; gap: 1rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <img src="images/avatar.png" alt="Полина" class="nav-avatar" />
            <span class="nav-title">Математика <span>с Полиной</span></span>
        </div>
        <div class="nav-menu">
            <a href="index.html"><i class="fas fa-home"></i> Главная</a>
            <a href="tests.html"><i class="fas fa-tasks"></i> Тесты</a>
            <a href="contacts.html"><i class="fas fa-envelope"></i> Контакты</a>
        </div>
    </nav>

    <div class="constructor-wrapper">
        <div class="form-panel">
            <h2><i class="fas fa-pen-fancy"></i> Создать вопрос</h2>

            <div class="input-group">
                <label><i class="fas fa-tag"></i> Название теста</label>
                <input type="text" id="testName" placeholder="Например: Уравнения 7 класс" value="Мой новый тест" />
            </div>

            <div class="input-group">
                <label><i class="fas fa-list"></i> Тип вопроса</label>
                <div class="question-types">
                    <button class="type-btn active" data-type="single" onclick="setQuestionType('single')">
                        <i class="fas fa-dot-circle"></i> Один ответ
                    </button>
                    <button class="type-btn" data-type="multiple" onclick="setQuestionType('multiple')">
                        <i class="fas fa-check-double"></i> Несколько ответов
                    </button>
                    <button class="type-btn" data-type="open" onclick="setQuestionType('open')">
                        <i class="fas fa-keyboard"></i> Открытый ответ
                    </button>
                    <button class="type-btn" data-type="file" onclick="setQuestionType('file')">
                        <i class="fas fa-file-pdf"></i> Ответ файлом
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label><i class="far fa-question-circle"></i> Текст вопроса</label>
                <textarea id="questionText" placeholder="Введите вопрос..."></textarea>
            </div>

            <div class="input-group">
                <label><i class="fas fa-image"></i> Картинка к вопросу (необязательно)</label>
                <div class="image-upload-field">
                    <input type="file" id="imageInput" accept="image/*" onchange="previewImage(this)" />
                    <div class="image-hint">Поддерживаются JPG, PNG, GIF, SVG</div>
                    <img id="imagePreview" class="image-preview" alt="Превью картинки" />
                </div>
            </div>

            <div class="input-group" id="optionsBlock">
                <label><i class="fas fa-list-ul"></i> Варианты ответов</label>
                <div class="options-grid" id="optionsGrid">
                    <div class="empty-options-hint" id="emptyHint">
                        <i class="fas fa-plus-circle" style="color:#ccc;"></i> Добавьте варианты ответов
                    </div>
                </div>
                <div class="add-option-row">
                    <input type="text" id="newOptionInput" placeholder="Напишите вариант ответа..." />
                    <button class="btn-small" onclick="addOption()"><i class="fas fa-plus"></i> Добавить</button>
                </div>
            </div>

            <div class="input-group open-answer-field" id="openAnswerBlock">
                <label><i class="fas fa-check-circle"></i> Правильный ответ</label>
                <input type="text" id="openAnswerInput" placeholder="Введите правильный ответ..." />
            </div>

            <div class="input-group file-answer-field" id="fileAnswerBlock">
                <div class="file-info">
                    <i class="fas fa-file-pdf"></i>
                    <div class="desc">
                        <strong>Ответ файлом (PDF)</strong><br />
                        <span style="font-size:0.85rem; color:#555;">Ученики смогут прикрепить PDF-файл с решением</span>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label><i class="fas fa-book"></i> Тема / раздел</label>
                <select id="topicSelect">
                    <option value="Математика">Математика</option>
                    <option value="Алгебра">Алгебра</option>
                    <option value="Геометрия">Геометрия</option>
                    <option value="ОГЭ">ОГЭ</option>
                </select>
            </div>

            <div class="input-group">
                <label><i class="fas fa-users"></i> Класс</label>
                <select id="classSelect">
                    <option value="">Не указан</option>
                    <option value="5">5 класс</option>
                    <option value="6">6 класс</option>
                    <option value="7">7 класс</option>
                    <option value="8">8 класс</option>
                    <option value="9">9 класс</option>
                    <option value="10">10 класс</option>
                    <option value="11">11 класс</option>
                </select>
            </div>

            <button class="btn-primary" onclick="addQuestion()">
                <i class="fas fa-plus-circle"></i> Добавить вопрос
            </button>

            <div class="action-row">
                <button class="btn-secondary" onclick="saveTest()">
                    <i class="fas fa-save"></i> Сохранить тест
                </button>
                <button class="btn-secondary" onclick="clearTest()">
                    <i class="fas fa-trash-alt"></i> Очистить
                </button>
            </div>
        </div>

        <div class="preview-panel">
            <h2>
                <i class="fas fa-eye"></i> Превью теста
                <span class="count" id="questionCount">0 вопросов</span>
            </h2>
            <div id="previewContainer">
                <div class="empty-preview">
                    <i class="fas fa-puzzle-piece"></i>
                    <div>Пока нет вопросов</div>
                    <div style="font-size:0.8rem; color:#aaa;">Добавьте первый вопрос</div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 Математика с Полиной · Сделано с ❤️
    </div>

    <script>
        let questions = [];
        let currentType = 'single';
        let currentImageData = null;

        function previewImage(input) {
            const preview = document.getElementById('imagePreview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.classList.add('show');
                    currentImageData = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            } else {
                preview.classList.remove('show');
                currentImageData = null;
            }
        }

        function setQuestionType(type) {
            currentType = type;
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === type);
            });

            const optionsBlock = document.getElementById('optionsBlock');
            const openBlock = document.getElementById('openAnswerBlock');
            const fileBlock = document.getElementById('fileAnswerBlock');

            optionsBlock.style.display = 'none';
            openBlock.classList.remove('show');
            fileBlock.classList.remove('show');

            if (type === 'single' || type === 'multiple') {
                optionsBlock.style.display = 'block';
            } else if (type === 'open') {
                openBlock.classList.add('show');
            } else if (type === 'file') {
                fileBlock.classList.add('show');
            }
        }

        function addOption() {
            const input = document.getElementById('newOptionInput');
            const text = input.value.trim();
            if (!text) { alert('Введите текст варианта'); return; }

            const grid = document.getElementById('optionsGrid');
            const hint = document.getElementById('emptyHint');
            if (hint) hint.remove();

            const index = grid.children.length;
            const isMultiple = currentType === 'multiple';
            const inputType = isMultiple ? 'checkbox' : 'radio';

            const div = document.createElement('div');
            div.className = 'option-item';
            div.innerHTML = `
                <input type="${inputType}" name="correctOption" value="${index}" ${index === 0 && !isMultiple ? 'checked' : ''} />
                <label>${text}</label>
                <button class="delete-option" onclick="removeOption(this)" title="Удалить вариант">
                    <i class="fas fa-times"></i>
                </button>
            `;
            grid.appendChild(div);
            input.value = '';
            input.focus();
            updateInputIndices();
        }

        function removeOption(button) {
            const item = button.closest('.option-item');
            if (item) {
                item.remove();
                updateInputIndices();
                const grid = document.getElementById('optionsGrid');
                if (grid.children.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-options-hint" id="emptyHint">
                            <i class="fas fa-plus-circle" style="color:#ccc;"></i> Добавьте варианты ответов
                        </div>
                    `;
                }
            }
        }

        function updateInputIndices() {
            const inputs = document.querySelectorAll('#optionsGrid input');
            inputs.forEach((r, idx) => {
                r.value = idx;
            });
            const radios = document.querySelectorAll('#optionsGrid input[type="radio"]');
            if (radios.length > 0) {
                const anyChecked = Array.from(radios).some(r => r.checked);
                if (!anyChecked) radios[0].checked = true;
            }
        }

        function getOptions() {
            const labels = document.querySelectorAll('#optionsGrid .option-item label');
            const options = [];
            labels.forEach(label => {
                options.push(label.textContent.trim());
            });
            return options;
        }

        function getSelectedCorrectIndices() {
            const inputs = document.querySelectorAll('#optionsGrid input');
            const indices = [];
            inputs.forEach((input, idx) => {
                if (input.checked) indices.push(idx);
            });
            return indices;
        }

        function addQuestion() {
            const text = document.getElementById('questionText').value.trim();
            if (!text) { alert('Введите текст вопроса'); return; }

            let questionData = {
                text: text,
                type: currentType,
                topic: document.getElementById('topicSelect').value,
                class: document.getElementById('classSelect').value
            };

            if (currentImageData) {
                questionData.image = currentImageData;
            }

            if (currentType === 'single' || currentType === 'multiple') {
                const options = getOptions();
                if (options.length < 2) { 
                    alert('Добавьте минимум 2 варианта ответа'); 
                    return; 
                }
                const correctIndices = getSelectedCorrectIndices();
                if (correctIndices.length === 0) {
                    alert('Выберите правильный ответ (варианты)');
                    return;
                }
                questionData.options = options;
                questionData.correctIndices = correctIndices;
            } else if (currentType === 'open') {
                const answer = document.getElementById('openAnswerInput').value.trim();
                if (!answer) {
                    alert('Введите правильный ответ');
                    return;
                }
                questionData.correctAnswer = answer;
            } else if (currentType === 'file') {
                questionData.fileRequired = true;
            }

            questions.push(questionData);
            renderPreview();
            resetForm();
        }

        function resetForm() {
            document.getElementById('questionText').value = '';
            document.getElementById('openAnswerInput').value = '';
            document.getElementById('imageInput').value = '';
            document.getElementById('imagePreview').classList.remove('show');
            currentImageData = null;
            
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = `
                <div class="empty-options-hint" id="emptyHint">
                    <i class="fas fa-plus-circle" style="color:#ccc;"></i> Добавьте варианты ответов
                </div>
            `;
            document.getElementById('newOptionInput').value = '';
        }

        function renderPreview() {
            const container = document.getElementById('previewContainer');
            const count = document.getElementById('questionCount');

            if (questions.length === 0) {
                container.innerHTML = `
                    <div class="empty-preview">
                        <i class="fas fa-puzzle-piece"></i>
                        <div>Пока нет вопросов</div>
                        <div style="font-size:0.8rem; color:#aaa;">Добавьте первый вопрос</div>
                    </div>
                `;
                count.textContent = '0 вопросов';
                return;
            }

            const typeLabels = {
                'single': 'Один ответ',
                'multiple': 'Несколько ответов',
                'open': 'Открытый ответ',
                'file': 'Ответ файлом'
            };

            let html = '';
            questions.forEach((q, i) => {
                html += `<div class="preview-question">`;
                html += `<div class="q-text">${i+1}. ${q.text}</div>`;
                
                if (q.image) {
                    html += `<img src="${q.image}" class="q-image" alt="Иллюстрация" />`;
                }
                
                if (q.type === 'single' || q.type === 'multiple') {
                    html += `<div class="q-options">`;
                    q.options.forEach((opt, idx) => {
                        const isCorrect = q.correctIndices.includes(idx);
                        html += `<span class="${isCorrect ? 'correct' : ''}">${opt} ${isCorrect ? '✓' : ''}</span>`;
                    });
                    html += `</div>`;
                } else if (q.type === 'open') {
                    html += `<div style="background:#f0f5ff; padding:0.5rem 1rem; border-radius:12px; font-size:0.9rem; color:#333;">
                        <i class="fas fa-keyboard" style="color:#8D0B0D;"></i> Правильный ответ: <strong>${q.correctAnswer}</strong>
                    </div>`;
                } else if (q.type === 'file') {
                    html += `<div style="background:#f0f5ff; padding:0.5rem 1rem; border-radius:12px; font-size:0.9rem; color:#333;">
                        <i class="fas fa-file-pdf" style="color:#8D0B0D;"></i> 
                        <strong>Ученик прикрепляет PDF-файл с решением</strong>
                    </div>`;
                }

                html += `<div class="q-meta">
                    <i class="far fa-bookmark"></i> ${q.topic} · 
                    ${q.class ? `${q.class} класс · ` : ''}
                    <span class="q-type-badge">${typeLabels[q.type] || 'Один ответ'}</span>
                </div>`;
                html += `</div>`;
            });

            container.innerHTML = html;
            count.textContent = `${questions.length} ${questions.length === 1 ? 'вопрос' : 'вопросов'}`;
        }

        function saveTest() {
            if (questions.length === 0) {
                alert('Добавьте хотя бы один вопрос!');
                return;
            }

            const name = document.getElementById('testName').value.trim() || 'Без названия';
            const testData = {
                name: name,
                topic: document.getElementById('topicSelect').value,
                class: document.getElementById('classSelect').value,
                questions: questions,
                created: Date.now()
            };

            let saved = JSON.parse(localStorage.getItem('polina_tests') || '[]');
            saved.push(testData);
            localStorage.setItem('polina_tests', JSON.stringify(saved));

            alert(`✅ Тест «${name}» сохранён! (${questions.length} вопросов)`);
            questions = [];
            renderPreview();
            document.getElementById('testName').value = '';
        }

        function clearTest() {
            if (questions.length === 0) return;
            if (confirm('Удалить все вопросы?')) {
                questions = [];
                renderPreview();
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            setQuestionType('single');

            document.getElementById('newOptionInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); addOption(); }
            });
            document.getElementById('questionText').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addQuestion(); }
            });
            document.getElementById('openAnswerInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); addQuestion(); }
            });
        });
    </script>

</body>
</html>
