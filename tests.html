<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тесты · Математика с Полиной</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F1EBE9;
            color: #000000;
            min-height: 100vh;
        }

        .navbar {
            background: #ffffff;
            padding: 1rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border-bottom: 3px solid #FBC5D9;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .nav-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #FBC5D9;
            box-shadow: 0 4px 12px rgba(141,11,13,0.15);
            transition: transform 0.2s;
        }
        .nav-avatar:hover { transform: scale(1.05); }
        .nav-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: #8D0B0D;
            letter-spacing: -0.02em;
        }
        .nav-title span { font-weight: 400; color: #555; }
        .nav-menu {
            display: flex;
            gap: 2rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-menu a {
            text-decoration: none;
            color: #000000;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.5rem 0.2rem;
            border-bottom: 3px solid transparent;
            transition: 0.25s;
        }
        .nav-menu a:hover,
        .nav-menu a.active {
            border-bottom-color: #8D0B0D;
            color: #8D0B0D;
        }
        .nav-menu a i { margin-right: 6px; }

        .admin-controls {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .admin-btn {
            background: #8D0B0D;
            color: #FFFFFF;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .admin-btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        .admin-btn.logout {
            background: #555;
        }
        .admin-btn.logout:hover {
            background: #333;
        }
        .admin-status {
            font-size: 0.75rem;
            color: #27ae60;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .page-header {
            padding: 2rem 4rem 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            color: #8D0B0D;
        }
        .page-header h1 i { margin-right: 10px; }

        .btn-primary {
            background: #8D0B0D;
            color: #FFFFFF;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            transition: 0.25s;
            box-shadow: 0 8px 20px rgba(141,11,13,0.2);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(141,11,13,0.35);
        }
        .btn-primary.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .filters {
            display: flex;
            gap: 1rem;
            padding: 1rem 4rem 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .filters label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #555;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .filters select {
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            border: 2px solid #e0d8d4;
            background: #faf8f7;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .filters select:focus {
            outline: none;
            border-color: #8D0B0D;
        }
        .filters .reset-filters {
            background: none;
            border: none;
            color: #8D0B0D;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: underline;
        }
        .filters .reset-filters:hover {
            color: #a93226;
        }
        .filter-count {
            margin-left: auto;
            font-size: 0.85rem;
            color: #999;
        }

        .tests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8rem;
            padding: 1.5rem 4rem 3rem;
        }

        .test-card {
            background: #ffffff;
            border-radius: 32px;
            padding: 1.8rem 1.8rem 1.5rem;
            box-shadow: 0 8px 0 #d0c8c4, 0 12px 28px rgba(0,0,0,0.06);
            border: 1px solid #e8e0dc;
            transition: 0.3s;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 220px;
            height: 100%;
        }
        .test-card:hover {
            transform: translateY(-6px);
        }
        .test-card::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            right: -4px;
            bottom: -4px;
            background: #FBC5D9;
            border-radius: 32px;
            z-index: -1;
            opacity: 0.2;
        }

        .test-card .test-icon {
            font-size: 2rem;
            color: #8D0B0D;
            margin-bottom: 0.3rem;
        }
        .test-card h3 {
            font-size: 1.15rem;
            margin: 0.2rem 0 0.2rem;
            color: #000;
            flex: 1;
        }
        .test-card .meta {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 0.8rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .test-card .meta .badge {
            background: #FBC5D9;
            padding: 0.1rem 0.6rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .test-card .meta .date {
            color: #999;
            font-size: 0.7rem;
        }
        .test-card .card-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: auto;
            flex-wrap: wrap;
        }
        .test-card .btn-small {
            background: #FBC5D9;
            color: #000;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .test-card .btn-small:hover {
            background: #f5b2cc;
        }
        .test-card .btn-small-primary {
            background: #8D0B0D;
            color: #fff;
        }
        .test-card .btn-small-primary:hover {
            background: #a93226;
        }
        .test-card .btn-danger {
            background: #c0392b;
            color: #fff;
        }
        .test-card .btn-danger:hover {
            background: #a93226;
        }
        .test-card .btn-edit {
            background: #2c3e50;
            color: #fff;
        }
        .test-card .btn-edit:hover {
            background: #1a252f;
        }

        .admin-only {
            display: none !important;
        }
        .admin-only.show {
            display: inline-flex !important;
        }

        .empty-tests {
            text-align: center;
            padding: 4rem 2rem;
            color: #777;
            grid-column: 1 / -1;
        }
        .empty-tests i {
            font-size: 3rem;
            color: #FBC5D9;
            display: block;
            margin-bottom: 0.8rem;
        }

        .footer {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 0.85rem;
            border-top: 2px solid #FBC5D9;
            margin-top: 1rem;
            background: rgba(255, 255, 255, 0.5);
        }

        /* ===== МОДАЛЬНОЕ ОКНО ПАРОЛЯ ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-box {
            background: #ffffff;
            border-radius: 32px;
            padding: 2.5rem;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .modal-box h2 {
            font-family: 'Playfair Display', serif;
            color: #8D0B0D;
            margin-bottom: 0.5rem;
        }
        .modal-box p {
            color: #666;
            margin-bottom: 1.5rem;
        }
        .modal-box input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            border: 2px solid #e0d8d4;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            margin-bottom: 1rem;
        }
        .modal-box input:focus {
            outline: none;
            border-color: #8D0B0D;
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
        }
        .modal-box .modal-actions button {
            padding: 0.6rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-box .modal-actions .btn-confirm {
            background: #8D0B0D;
            color: #fff;
        }
        .modal-box .modal-actions .btn-confirm:hover {
            background: #a93226;
        }
        .modal-box .modal-actions .btn-cancel {
            background: #e0d8d4;
            color: #333;
        }
        .modal-box .modal-actions .btn-cancel:hover {
            background: #ccc;
        }
        .modal-box .error-msg {
            color: #c0392b;
            font-size: 0.85rem;
            margin-bottom: 0.8rem;
            display: none;
        }
        .modal-box .error-msg.show {
            display: block;
        }

        /* ===== МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ ===== */
        .edit-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            padding: 2rem 1rem;
        }
        .edit-modal-overlay.show {
            display: flex;
        }
        .edit-modal-box {
            background: #ffffff;
            border-radius: 32px;
            padding: 2rem;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .edit-modal-box h2 {
            font-family: 'Playfair Display', serif;
            color: #8D0B0D;
            margin-bottom: 0.5rem;
        }
        .edit-modal-box .sub {
            color: #666;
            margin-bottom: 1.5rem;
        }
        .edit-modal-box .edit-question {
            background: #faf8f7;
            border-radius: 20px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid #e8e0dc;
        }
        .edit-modal-box .edit-question .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
        }
        .edit-modal-box .edit-question .q-number {
            font-weight: 600;
            color: #8D0B0D;
        }
        .edit-modal-box .edit-question .delete-q {
            background: #c0392b;
            color: #fff;
            border: none;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .edit-modal-box .edit-question .delete-q:hover {
            background: #a93226;
        }
        .edit-modal-box .edit-question textarea,
        .edit-modal-box .edit-question input[type="text"] {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border-radius: 12px;
            border: 2px solid #e0d8d4;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            background: #ffffff;
            margin-bottom: 0.4rem;
        }
        .edit-modal-box .edit-question textarea:focus,
        .edit-modal-box .edit-question input[type="text"]:focus {
            outline: none;
            border-color: #8D0B0D;
        }
        .edit-modal-box .edit-question .option-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.3rem;
        }
        .edit-modal-box .edit-question .option-row input[type="text"] {
            margin-bottom: 0;
            flex: 1;
        }
        .edit-modal-box .edit-question .option-row .correct-mark {
            background: #8D0B0D;
            color: #fff;
            border: none;
            padding: 0.2rem 0.6rem;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .edit-modal-box .edit-question .option-row .correct-mark.active {
            background: #27ae60;
        }
        .edit-modal-box .edit-question .option-row .del-opt {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .edit-modal-box .edit-question .option-row .del-opt:hover {
            color: #c0392b;
        }
        .edit-modal-box .edit-question .add-opt-btn {
            background: #FBC5D9;
            border: none;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 0.3rem;
        }
        .edit-modal-box .edit-question .add-opt-btn:hover {
            background: #f5b2cc;
        }
        .edit-modal-box .edit-question .q-type {
            font-size: 0.75rem;
            color: #999;
            margin-bottom: 0.4rem;
        }
        .edit-modal-box .edit-actions {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .edit-modal-box .edit-actions button {
            padding: 0.6rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .edit-modal-box .edit-actions .btn-save {
            background: #8D0B0D;
            color: #fff;
        }
        .edit-modal-box .edit-actions .btn-save:hover {
            background: #a93226;
        }
        .edit-modal-box .edit-actions .btn-close-edit {
            background: #e0d8d4;
            color: #333;
        }
        .edit-modal-box .edit-actions .btn-close-edit:hover {
            background: #ccc;
        }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 0.8rem; padding: 1rem; }
            .nav-menu { flex-wrap: wrap; justify-content: center; gap: 1rem; }
            .page-header { padding: 1.5rem; flex-direction: column; align-items: flex-start; }
            .filters { padding: 0.5rem 1.5rem; }
            .tests-grid { padding: 1.5rem; grid-template-columns: 1fr; }
            .admin-controls { width: 100%; justify-content: flex-end; }
            .edit-modal-box { padding: 1.2rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <img src="images/avatar.png" alt="Полина" class="nav-avatar" />
            <span class="nav-title">Математика <span>с Полиной</span></span>
        </div>
        <div class="nav-menu">
            <a href="index.html"><i class="fas fa-home"></i> Главная</a>
            <a href="tests.html" class="active"><i class="fas fa-tasks"></i> Тесты</a>
            <a href="contacts.html"><i class="fas fa-envelope"></i> Контакты</a>
        </div>
        <div class="admin-controls">
            <span class="admin-status" id="adminStatus" style="display:none;">
                <i class="fas fa-circle" style="color:#27ae60;"></i> Админ
            </span>
            <button class="admin-btn" id="adminLoginBtn" onclick="showLoginModal()">
                <i class="fas fa-user-shield"></i> Вход
            </button>
            <button class="admin-btn logout" id="adminLogoutBtn" style="display:none;" onclick="logoutAdmin()">
                <i class="fas fa-sign-out-alt"></i> Выйти
            </button>
        </div>
    </nav>

    <!-- ===== МОДАЛЬНОЕ ОКНО ПАРОЛЯ ===== -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2><i class="fas fa-user-shield" style="color:#8D0B0D;"></i> Вход для учителя</h2>
            <p>Введите пароль для доступа к редактированию</p>
            <div class="error-msg" id="loginError">❌ Неверный пароль. Попробуйте ещё раз.</div>
            <input type="password" id="passwordInput" placeholder="Введите пароль..." onkeydown="if(event.key==='Enter') checkPassword()" />
            <div class="modal-actions">
                <button class="btn-confirm" onclick="checkPassword()">Войти</button>
                <button class="btn-cancel" onclick="closeLoginModal()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ ===== -->
    <div class="edit-modal-overlay" id="editModal">
        <div class="edit-modal-box" id="editModalBox">
            <h2 id="editModalTitle">✏️ Редактирование теста</h2>
            <div class="sub" id="editModalSub"></div>
            <div id="editModalContent"></div>
            <div class="edit-actions">
                <button class="btn-save" onclick="saveEditedTest()"><i class="fas fa-save"></i> Сохранить</button>
                <button class="btn-close-edit" onclick="closeEditModal()">Отмена</button>
            </div>
        </div>
    </div>

    <div class="page-header">
        <h1><i class="fas fa-tasks"></i> Мои тесты</h1>
        <a href="create-test.html" class="btn-primary" id="createTestBtn">
            <i class="fas fa-plus-circle"></i> Создать тест
        </a>
    </div>

    <div class="filters">
        <label>
            <i class="fas fa-users"></i> Класс:
            <select id="classFilter" onchange="applyFilters()">
                <option value="all">Все классы</option>
                <option value="5">5 класс</option>
                <option value="6">6 класс</option>
                <option value="7">7 класс</option>
                <option value="8">8 класс</option>
                <option value="9">9 класс</option>
                <option value="10">10 класс</option>
                <option value="11">11 класс</option>
            </select>
        </label>
        <label>
            <i class="fas fa-book"></i> Раздел:
            <select id="sectionFilter" onchange="applyFilters()">
                <option value="all">Все разделы</option>
                <option value="Математика">Математика</option>
                <option value="Алгебра">Алгебра</option>
                <option value="Геометрия">Геометрия</option>
                <option value="ОГЭ">ОГЭ</option>
            </select>
        </label>
        <button class="reset-filters" onclick="resetFilters()">
            <i class="fas fa-undo"></i> Сбросить
        </button>
        <span class="filter-count" id="testCount"></span>
    </div>

    <div class="tests-grid" id="testsGrid"></div>

    <div class="footer">
        &copy; 2026 Математика с Полиной · Сделано с ❤️
    </div>

    <script>
        // ===== ПАРОЛЬ =====
        const ADMIN_PASSWORD = 'polina2026';
        let isAdmin = false;
        let editingTestIndex = null;
        let editingTestData = null;

        // ===== СТАТУС АДМИНА =====
        function checkAdminStatus() {
            const saved = localStorage.getItem('polina_admin');
            if (saved === 'true') {
                isAdmin = true;
                showAdminUI();
            } else {
                isAdmin = false;
                hideAdminUI();
            }
        }

        function showAdminUI() {
            document.getElementById('adminStatus').style.display = 'inline';
            document.getElementById('adminLoginBtn').style.display = 'none';
            document.getElementById('adminLogoutBtn').style.display = 'inline-flex';
            document.getElementById('createTestBtn').classList.remove('disabled');
            document.querySelectorAll('.admin-only').forEach(el => el.classList.add('show'));
        }

        function hideAdminUI() {
            document.getElementById('adminStatus').style.display = 'none';
            document.getElementById('adminLoginBtn').style.display = 'inline-flex';
            document.getElementById('adminLogoutBtn').style.display = 'none';
            document.getElementById('createTestBtn').classList.add('disabled');
            document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('show'));
        }

        // ===== МОДАЛКА ПАРОЛЯ =====
        function showLoginModal() {
            document.getElementById('loginModal').classList.add('show');
            document.getElementById('passwordInput').value = '';
            document.getElementById('loginError').classList.remove('show');
            setTimeout(() => document.getElementById('passwordInput').focus(), 100);
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('show');
        }

        function checkPassword() {
            const input = document.getElementById('passwordInput');
            if (input.value === ADMIN_PASSWORD) {
                isAdmin = true;
                localStorage.setItem('polina_admin', 'true');
                closeLoginModal();
                showAdminUI();
                applyFilters();
            } else {
                document.getElementById('loginError').classList.add('show');
                input.value = '';
                input.focus();
            }
        }

        function logoutAdmin() {
            if (confirm('Выйти из режима администратора?')) {
                isAdmin = false;
                localStorage.removeItem('polina_admin');
                hideAdminUI();
                applyFilters();
            }
        }

        // ===== ЗАГРУЗКА ТЕСТОВ =====
        function loadTests() {
            const saved = localStorage.getItem('polina_tests');
            let tests = [];
            if (saved) {
                try {
                    tests = JSON.parse(saved);
                } catch (e) {
                    tests = [];
                }
            }

            if (tests.length === 0) {
                tests = [
                    {
                        name: 'Уравнения 7 класс',
                        topic: 'Алгебра',
                        class: '7',
                        questions: [
                            { text: 'Решите уравнение: 3x + 5 = 20', options: ['x=5', 'x=7', 'x=3', 'x=10'], correctIndices: [0], type: 'single' },
                            { text: 'Решите уравнение: 2x - 3 = 11', options: ['x=7', 'x=5', 'x=8', 'x=6'], correctIndices: [0], type: 'single' }
                        ],
                        created: Date.now() - 86400000
                    },
                    {
                        name: 'Треугольники 8 класс',
                        topic: 'Геометрия',
                        class: '8',
                        questions: [
                            { text: 'Сумма углов треугольника равна...', options: ['90°', '180°', '360°', '270°'], correctIndices: [1], type: 'single' }
                        ],
                        created: Date.now() - 172800000
                    },
                    {
                        name: 'Подготовка к ОГЭ',
                        topic: 'ОГЭ',
                        class: '9',
                        questions: [
                            { text: 'Решите задачу: ...', type: 'open', correctAnswer: '42' }
                        ],
                        created: Date.now() - 259200000
                    }
                ];
                localStorage.setItem('polina_tests', JSON.stringify(tests));
            }

            tests.sort((a, b) => (b.created || 0) - (a.created || 0));
            applyFiltersToTests(tests);
        }

        function applyFiltersToTests(tests) {
            const classFilter = document.getElementById('classFilter').value;
            const sectionFilter = document.getElementById('sectionFilter').value;

            let filtered = tests.filter(test => {
                let matchClass = true;
                let matchSection = true;
                if (classFilter !== 'all') {
                    matchClass = String(test.class) === String(classFilter);
                }
                if (sectionFilter !== 'all') {
                    matchSection = test.topic === sectionFilter;
                }
                return matchClass && matchSection;
            });

            renderTests(filtered);
            document.getElementById('testCount').textContent = `Найдено: ${filtered.length}`;
        }

        function renderTests(tests) {
            const container = document.getElementById('testsGrid');

            if (tests.length === 0) {
                container.innerHTML = `
                    <div class="empty-tests">
                        <i class="fas fa-folder-open"></i>
                        <div>Нет тестов по выбранным фильтрам</div>
                        <div style="font-size:0.8rem; color:#aaa;">Создайте новый тест или измените фильтры</div>
                    </div>
                `;
                return;
            }

            const typeLabels = {
                'single': 'Один ответ',
                'multiple': 'Несколько ответов',
                'open': 'Открытый ответ',
                'file': 'Ответ файлом'
            };

            let html = '';
            tests.forEach((test, index) => {
                const questionCount = test.questions ? test.questions.length : 0;
                const types = test.questions ? test.questions.map(q => typeLabels[q.type] || 'Один ответ') : [];
                const uniqueTypes = [...new Set(types)];
                const date = test.created ? new Date(test.created).toLocaleDateString('ru-RU') : 'Нет даты';

                let icon = 'fa-file-alt';
                if (test.topic === 'Алгебра') icon = 'fa-calculator';
                else if (test.topic === 'Геометрия') icon = 'fa-shapes';
                else if (test.topic === 'ОГЭ') icon = 'fa-graduation-cap';

                html += `
                    <div class="test-card">
                        <div class="test-icon"><i class="fas ${icon}"></i></div>
                        <h3>${test.name || 'Без названия'}</h3>
                        <div class="meta">
                            <span class="badge">${test.topic || 'Общее'}</span>
                            ${test.class ? `<span class="badge">${test.class} класс</span>` : ''}
                            <span class="date"><i class="far fa-calendar-alt"></i> ${date}</span>
                        </div>
                        <div style="font-size:0.8rem; color:#555; margin-bottom:0.6rem;">
                            ${questionCount} ${questionCount === 1 ? 'вопрос' : 'вопросов'}
                            ${uniqueTypes.length > 0 ? `· ${uniqueTypes.join(', ')}` : ''}
                        </div>
                        <div class="card-actions">
                            <button class="btn-small btn-small-primary" onclick="openTest(${index})">
                                <i class="fas fa-play"></i> Пройти
                            </button>
                            <button class="btn-small btn-edit admin-only" onclick="openEditModal(${index})">
                                <i class="fas fa-edit"></i> Редактировать
                            </button>
                            <button class="btn-small btn-danger admin-only" onclick="deleteTest(${index})">
                                <i class="fas fa-trash-alt"></i> Удалить
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            if (isAdmin) {
                document.querySelectorAll('.admin-only').forEach(el => el.classList.add('show'));
            }
        }

        function applyFilters() {
            const saved = localStorage.getItem('polina_tests');
            let tests = saved ? JSON.parse(saved) : [];
            tests.sort((a, b) => (b.created || 0) - (a.created || 0));
            applyFiltersToTests(tests);
        }

        function resetFilters() {
            document.getElementById('classFilter').value = 'all';
            document.getElementById('sectionFilter').value = 'all';
            applyFilters();
        }

        function openTest(index) {
            const saved = localStorage.getItem('polina_tests');
            let tests = saved ? JSON.parse(saved) : [];
            tests.sort((a, b) => (b.created || 0) - (a.created || 0));
            if (index >= 0 && index < tests.length) {
                localStorage.setItem('current_test', JSON.stringify(tests[index]));
                window.location.href = 'test-pass.html';
            } else {
                alert('Тест не найден');
            }
        }

        function deleteTest(index) {
            if (!confirm('Вы уверены, что хотите удалить этот тест?')) return;
            const saved = localStorage.getItem('polina_tests');
            let tests = saved ? JSON.parse(saved) : [];
            tests.sort((a, b) => (b.created || 0) - (a.created || 0));
            if (index >= 0 && index < tests.length) {
                tests.splice(index, 1);
                localStorage.setItem('polina_tests', JSON.stringify(tests));
                applyFilters();
            }
        }

        // ===== ОТКРЫТЬ МОДАЛКУ РЕДАКТИРОВАНИЯ =====
        function openEditModal(index) {
            if (!isAdmin) {
                alert('Только учитель может редактировать тесты. Войдите в режим администратора.');
                return;
            }

            const saved = localStorage.getItem('polina_tests');
            let tests = saved ? JSON.parse(saved) : [];
            tests.sort((a, b) => (b.created || 0) - (a.created || 0));

            if (index >= 0 && index < tests.length) {
                editingTestIndex = index;
                editingTestData = JSON.parse(JSON.stringify(tests[index])); // копия
                renderEditModal();
                document.getElementById('editModal').classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                alert('Тест не найден');
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            document.body.style.overflow = 'auto';
            editingTestData = null;
            editingTestIndex = null;
        }

        function renderEditModal() {
            const title = document.getElementById('editModalTitle');
            const sub = document.getElementById('editModalSub');
            const content = document.getElementById('editModalContent');

            title.textContent = `✏️ Редактирование: ${editingTestData.name || 'Без названия'}`;
            sub.textContent = `${editingTestData.topic || 'Общее'} · ${editingTestData.class ? editingTestData.class + ' класс' : 'Класс не указан'} · ${editingTestData.questions ? editingTestData.questions.length : 0} вопросов`;

            const typeLabels = {
                'single': 'Один ответ',
                'multiple': 'Несколько ответов',
                'open': 'Открытый ответ',
                'file': 'Ответ файлом'
            };

            let html = '';
            if (!editingTestData.questions || editingTestData.questions.length === 0) {
                html = `<div style="text-align:center; padding:2rem; color:#999;">В этом тесте нет вопросов</div>`;
            } else {
                editingTestData.questions.forEach((q, qIndex) => {
                    html += `<div class="edit-question" data-qindex="${qIndex}">`;
                    html += `<div class="q-header">
                        <span class="q-number">Вопрос ${qIndex + 1}</span>
                        <button class="delete-q" onclick="deleteQuestionFromEdit(${qIndex})">
                            <i class="fas fa-trash-alt"></i> Удалить
                        </button>
                    </div>`;
                    html += `<div class="q-type">Тип: ${typeLabels[q.type] || 'Один ответ'}</div>`;
                    html += `<textarea class="q-text-edit" rows="2">${(q.text || '').replace(/"/g, '&quot;')}</textarea>`;

                    if (q.type === 'single' || q.type === 'multiple') {
                        html += `<div class="options-edit" id="edit-options-${qIndex}">`;
                        if (q.options && q.options.length > 0) {
                            q.options.forEach((opt, optIndex) => {
                                const isCorrect = q.correctIndices && q.correctIndices.includes(optIndex);
                                html += `
                                    <div class="option-row">
                                        <input type="text" class="opt-input" value="${opt.replace(/"/g, '&quot;')}" />
                                        <button class="correct-mark ${isCorrect ? 'active' : ''}" onclick="toggleCorrectInEdit(${qIndex}, ${optIndex})">
                                            ${isCorrect ? '✓ Правильный' : '✔ Сделать правильным'}
                                        </button>
                                        <button class="del-opt" onclick="deleteOptionFromEdit(${qIndex}, ${optIndex})">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </div>
                                `;
                            });
                        }
                        html += `<button class="add-opt-btn" onclick="addOptionToEdit(${qIndex})">+ Добавить вариант</button>`;
                        html += `</div>`;
                    } else if (q.type === 'open') {
                        html += `<div style="margin-top:0.5rem;">
                            <label style="font-weight:600; font-size:0.85rem; display:block; margin-bottom:0.3rem;">Правильный ответ:</label>
                            <input type="text" class="open-answer-edit" value="${(q.correctAnswer || '').replace(/"/g, '&quot;')}" />
                        </div>`;
                    } else if (q.type === 'file') {
                        html += `<div style="margin-top:0.5rem; color:#999; font-size:0.85rem;">
                            <i class="fas fa-file-pdf"></i> Ученик прикрепляет PDF-файл
                        </div>`;
                    }

                    html += `</div>`;
                });
            }

            content.innerHTML = html;
        }

        // ===== РЕДАКТИРОВАНИЕ: ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
        function deleteQuestionFromEdit(index) {
            if (!confirm('Удалить этот вопрос?')) return;
            editingTestData.questions.splice(index, 1);
            renderEditModal();
        }

        function addOptionToEdit(qIndex) {
            const q = editingTestData.questions[qIndex];
            if (!q.options) q.options = [];
            q.options.push('Новый вариант');
            if (!q.correctIndices) q.correctIndices = [];
            renderEditModal();
        }

        function deleteOptionFromEdit(qIndex, optIndex) {
            const q = editingTestData.questions[qIndex];
            if (q.options.length <= 2) {
                alert('Должно быть минимум 2 варианта');
                return;
            }
            q.options.splice(optIndex, 1);
            q.correctIndices = q.correctIndices.filter(i => i !== optIndex).map(i => i > optIndex ? i - 1 : i);
            renderEditModal();
        }

        function toggleCorrectInEdit(qIndex, optIndex) {
            const q = editingTestData.questions[qIndex];
            if (q.type === 'single') {
                q.correctIndices = [optIndex];
            } else {
                const idx = q.correctIndices.indexOf(optIndex);
                if (idx === -1) {
                    q.correctIndices.push(optIndex);
                } else {
                    q.correctIndices.splice(idx, 1);
                }
            }
            renderEditModal();
        }

        function saveEditedTest() {
            // Собираем данные из формы
            const questionBlocks = document.querySelectorAll('#editModalContent .edit-question');
            questionBlocks.forEach((block, idx) => {
                const q = editingTestData.questions[idx];
                if (!q) return;

                const textArea = block.querySelector('.q-text-edit');
                if (textArea) q.text = textArea.value;

                if (q.type === 'single' || q.type === 'multiple') {
                    const optInputs = block.querySelectorAll('.opt-input');
                    const newOptions = [];
                    optInputs.forEach(input => newOptions.push(input.value));
                    q.options = newOptions;
                } else if (q.type === 'open') {
                    const openInput = block.querySelector('.open-answer-edit');
                    if (openInput) q.correctAnswer = openInput.value;
                }
            });

            // Сохраняем
            const allTests = JSON.parse(localStorage.getItem('polina_tests') || '[]');
            allTests.sort((a, b) => (b.created || 0) - (a.created || 0));

            if (editingTestIndex !== null && editingTestIndex < allTests.length) {
                allTests[editingTestIndex] = editingTestData;
                localStorage.setItem('polina_tests', JSON.stringify(allTests));
                alert('✅ Тест успешно обновлён!');
                closeEditModal();
                applyFilters();
            } else {
                alert('Ошибка: тест не найден');
            }
        }

        // ===== ЗАКРЫТИЕ МОДАЛКИ ПО КЛИКУ ВНЕ =====
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeEditModal();
        });

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        window.addEventListener('DOMContentLoaded', function() {
            checkAdminStatus();
            loadTests();

            document.getElementById('loginModal').addEventListener('click', function(e) {
                if (e.target === this) closeLoginModal();
            });
        });
    </script>

</body>
</html>
