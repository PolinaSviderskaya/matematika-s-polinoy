    <script>
        const TOTAL_QUESTIONS = 12;
        const ALL_EXAMPLES_COUNT = 100;

        let currentQuestions = [];
        let currentIndex = 0;
        let correctCount = 0;
        let answered = false;

        // ===== НОД ДЛЯ СОКРАЩЕНИЯ =====
        function gcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b) {
                [a, b] = [b, a % b];
            }
            return a;
        }

        // ===== СОКРАЩЕНИЕ ДРОБИ =====
        function simplifyFraction(num, den) {
            if (den < 0) { num = -num; den = -den; }
            if (num === 0) return { whole: 0, num: 0, den: 1 };
            const g = gcd(Math.abs(num), Math.abs(den));
            num = num / g;
            den = den / g;
            if (Math.abs(num) >= den) {
                const whole = Math.floor(num / den);
                num = num % den;
                if (num === 0) return { whole: whole, num: 0, den: 1 };
                return { whole: whole, num: num, den: den };
            }
            return { whole: 0, num: num, den: den };
        }

        // ===== ГЕНЕРАЦИЯ ПРИМЕРОВ =====
        function generateAllExamples() {
            const examples = [];
            const operations = ['+', '-', '*', '/'];

            for (let i = 0; i < ALL_EXAMPLES_COUNT * 2; i++) {
                let aNum, aDen, bNum, bDen, op, answerNum, answerDen, display;

                // Генерируем дроби: числители от 1 до 9, знаменатели от 2 до 12
                aNum = Math.floor(Math.random() * 9) + 1;
                do { aDen = Math.floor(Math.random() * 11) + 2; } while (aDen <= aNum);
                bNum = Math.floor(Math.random() * 9) + 1;
                do { bDen = Math.floor(Math.random() * 11) + 2; } while (bDen <= bNum);

                const opIndex = Math.floor(Math.random() * operations.length);
                op = operations[opIndex];

                let resultNum, resultDen;

                switch(op) {
                    case '+':
                        resultNum = aNum * bDen + bNum * aDen;
                        resultDen = aDen * bDen;
                        display = `${aNum}/${aDen} + ${bNum}/${bDen}`;
                        break;
                    case '-':
                        // Чтобы результат не был отрицательным, проверяем
                        if (aNum * bDen < bNum * aDen) {
                            [aNum, bNum] = [bNum, aNum];
                            [aDen, bDen] = [bDen, aDen];
                        }
                        resultNum = aNum * bDen - bNum * aDen;
                        resultDen = aDen * bDen;
                        display = `${aNum}/${aDen} − ${bNum}/${bDen}`;
                        break;
                    case '*':
                        resultNum = aNum * bNum;
                        resultDen = aDen * bDen;
                        display = `${aNum}/${aDen} × ${bNum}/${bDen}`;
                        break;
                    case '/':
                        resultNum = aNum * bDen;
                        resultDen = aDen * bNum;
                        display = `${aNum}/${aDen} : ${bNum}/${bDen}`;
                        break;
                }

                // Сокращаем результат
                const simplified = simplifyFraction(resultNum, resultDen);
                answerNum = simplified.num;
                answerDen = simplified.den;
                const whole = simplified.whole;

                examples.push({
                    aNum, aDen, bNum, bDen, op,
                    display: display,
                    answerWhole: whole,
                    answerNum: answerNum,
                    answerDen: answerDen
                });

                if (examples.length >= ALL_EXAMPLES_COUNT) break;
            }
            return examples;
        }

        function selectRandomQuestions(allExamples) {
            const shuffled = [...allExamples];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled.slice(0, TOTAL_QUESTIONS);
        }

        function renderFraction(num, den) {
            if (num === 0) return '0';
            if (den === 1) return `${num}`;
            return `<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;
        }

        function initGame() {
            const allExamples = generateAllExamples();
            currentQuestions = selectRandomQuestions(allExamples);
            currentIndex = 0;
            correctCount = 0;
            answered = false;

            document.getElementById('finishScreen').style.display = 'none';
            document.getElementById('questionCard').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'inline-flex';

            updateProgress();
            renderQuestion();
        }

        function updateProgress() {
            const percent = Math.round((correctCount / TOTAL_QUESTIONS) * 100);
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressPercent').textContent = percent;
        }

        function renderQuestion() {
            const q = currentQuestions[currentIndex];
            document.getElementById('questionNumberLabel').textContent = `Вопрос ${currentIndex + 1} из ${TOTAL_QUESTIONS}`;
            document.getElementById('questionText').innerHTML = q.display;

            document.getElementById('wholeInput').value = '';
            document.getElementById('numInput').value = '';
            document.getElementById('denInput').value = '';
            document.getElementById('wholeInput').disabled = false;
            document.getElementById('numInput').disabled = false;
            document.getElementById('denInput').disabled = false;

            document.getElementById('checkBtn').disabled = false;
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('answerResult').textContent = '';
            document.getElementById('answerResult').className = 'answer-result';

            answered = false;

            document.getElementById('wholeInput').focus();
        }

        function checkAnswer() {
            if (answered) return;

            const wholeInput = document.getElementById('wholeInput').value.trim();
            const numInput = document.getElementById('numInput').value.trim();
            const denInput = document.getElementById('denInput').value.trim();

            if (wholeInput === '' || numInput === '' || denInput === '') {
                alert('Заполните все поля!');
                return;
            }

            const userWhole = parseInt(wholeInput) || 0;
            const userNum = parseInt(numInput) || 0;
            const userDen = parseInt(denInput) || 1;

            if (userDen <= 0) {
                alert('Знаменатель должен быть положительным числом!');
                return;
            }

            const q = currentQuestions[currentIndex];
            const correctWhole = q.answerWhole || 0;
            const correctNum = q.answerNum || 0;
            const correctDen = q.answerDen || 1;

            const resultDiv = document.getElementById('answerResult');

            // Проверяем эквивалентность дробей
            const userSimplified = simplifyFraction(userWhole * userDen + userNum, userDen);
            const correctSimplified = simplifyFraction(correctWhole * correctDen + correctNum, correctDen);

            const isCorrect = userSimplified.num === correctSimplified.num &&
                              userSimplified.den === correctSimplified.den &&
                              userSimplified.whole === correctSimplified.whole;

            if (isCorrect) {
                resultDiv.textContent = '✅ Правильно!';
                resultDiv.className = 'answer-result correct';
                correctCount++;
                updateProgress();
            } else {
                let correctDisplay = '';
                if (correctWhole !== 0) correctDisplay += correctWhole + ' ';
                if (correctNum !== 0 || correctDen !== 1) {
                    correctDisplay += `${correctNum}/${correctDen}`;
                }
                if (correctDisplay.trim() === '') correctDisplay = '0';
                resultDiv.innerHTML = `❌ Неправильно. Правильный ответ: <span class="correct-answer-show">${correctDisplay}</span>`;
                resultDiv.className = 'answer-result wrong';
            }

            answered = true;
            document.getElementById('wholeInput').disabled = true;
            document.getElementById('numInput').disabled = true;
            document.getElementById('denInput').disabled = true;
            document.getElementById('checkBtn').disabled = true;
            document.getElementById('nextBtn').disabled = false;

            if (currentIndex === TOTAL_QUESTIONS - 1) {
                document.getElementById('nextBtn').innerHTML = '<i class="fas fa-trophy"></i> Завершить';
            } else {
                document.getElementById('nextBtn').innerHTML = '<i class="fas fa-arrow-right"></i> Далее';
            }
        }

        function nextQuestion() {
            if (!answered) return;

            if (currentIndex === TOTAL_QUESTIONS - 1) {
                showFinish();
                return;
            }

            currentIndex++;
            renderQuestion();
        }

        function showFinish() {
            document.getElementById('questionCard').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('finishScreen').style.display = 'block';
            document.getElementById('finalScore').textContent = correctCount;

            const finishText = document.querySelector('.finish-text');
            if (correctCount === TOTAL_QUESTIONS) {
                finishText.textContent = '🌟 Идеально! Ты справился со всеми заданиями! 🌟';
            } else if (correctCount >= TOTAL_QUESTIONS * 0.7) {
                finishText.textContent = '🎉 Отличный результат! Продолжай в том же духе!';
            } else if (correctCount >= TOTAL_QUESTIONS * 0.4) {
                finishText.textContent = '💪 Хорошая попытка! Тренируйся ещё!';
            } else {
                finishText.textContent = '📚 Нужно ещё немного потренироваться. Попробуй снова!';
            }
        }

        function restartGame() {
            initGame();
            document.getElementById('app').scrollIntoView({ behavior: 'smooth' });
        }

        document.addEventListener('DOMContentLoaded', function() {
            initGame();

            // Обработка Enter
            document.getElementById('wholeInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    if (!answered) checkAnswer();
                    else nextQuestion();
                }
            });
            document.getElementById('numInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    if (!answered) checkAnswer();
                    else nextQuestion();
                }
            });
            document.getElementById('denInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    if (!answered) checkAnswer();
                    else nextQuestion();
                }
            });
        });
    </script>
