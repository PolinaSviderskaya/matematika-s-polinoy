<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тренажёр · Действия с десятичными дробями</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F1EBE9;
            color: #000000;
            min-height: 100vh;
            padding-top: 70px;
        }

        /* ===== ШАПКА С БУРГЕРОМ ===== */
        .navbar {
            background: #ffffff;
            padding: 0.6rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border-bottom: 3px solid #FBC5D9;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            min-height: 60px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #FBC5D9;
            box-shadow: 0 4px 12px rgba(141,11,13,0.15);
            transition: transform 0.2s;
        }
        .nav-avatar:hover { transform: scale(1.05); }

        .nav-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: #8D0B0D;
            letter-spacing: -0.02em;
        }
        .nav-title span { font-weight: 400; color: #555; }

        .burger-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.8rem;
            color: #8D0B0D;
            cursor: pointer;
            padding: 0.3rem;
            transition: 0.3s;
        }
        .burger-btn:hover { transform: scale(1.1); }

        .nav-menu {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        .nav-menu a {
            text-decoration: none;
            color: #000000;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.5rem 0.2rem;
            border-bottom: 3px solid transparent;
            transition: 0.25s;
        }
        .nav-menu a:hover,
        .nav-menu a.active {
            border-bottom-color: #8D0B0D;
            color: #8D0B0D;
        }
        .nav-menu a i { margin-right: 6px; }

        /* ===== ТРЕНАЖЁР ===== */
        .trainer-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1.5rem 3rem;
        }

        .trainer-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .trainer-header h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 2.8rem;
            color: #8D0B0D;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        .trainer-header .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: #666;
            margin-top: 0.3rem;
        }

        /* ===== ПОЛОСА ПРОГРЕССА ===== */
        .progress-section {
            background: #ffffff;
            border-radius: 20px;
            padding: 1.2rem 2rem;
            box-shadow: 0 4px 0 #d0c8c4, 0 8px 20px rgba(0,0,0,0.04);
            border: 1px solid #e8e0dc;
            margin-bottom: 2rem;
        }
        .progress-bar-container {
            width: 100%;
            height: 20px;
            background: #e8e0dc;
            border-radius: 40px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #8D0B0D;
            border-radius: 40px;
            transition: width 0.5s ease;
        }
        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 0.4rem;
            font-size: 0.85rem;
            color: #888;
            font-weight: 500;
        }
        .progress-text .score-display {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: #8D0B0D;
        }

        /* ===== КАРТОЧКА ВОПРОСА ===== */
        .question-card {
            background: #ffffff;
            border-radius: 32px;
            padding: 2.5rem 3rem;
            box-shadow: 0 8px 0 #d0c8c4, 0 12px 28px rgba(0,0,0,0.06);
            border: 1px solid #e8e0dc;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .question-card .question-number {
            font-size: 0.85rem;
            color: #999;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .question-card .question-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: #1a2639;
            margin-bottom: 1.5rem;
            letter-spacing: 0.02em;
        }
        .question-card .question-text .highlight {
            color: #8D0B0D;
        }

        .answer-inputs {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .answer-inputs .answer-field {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
        }
        .answer-inputs .answer-field label {
            font-size: 0.7rem;
            color: #999;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .answer-inputs .answer-field input {
            width: 100px;
            padding: 0.6rem 0.5rem;
            border-radius: 12px;
            border: 2px solid #e0d8d4;
            font-family: 'Inter', sans-serif;
            font-size: 1.4rem;
            text-align: center;
            background: #faf8f7;
            transition: 0.2s;
        }
        .answer-inputs .answer-field input:focus {
            outline: none;
            border-color: #8D0B0D;
            background: #ffffff;
        }
        .answer-inputs .answer-field input:disabled {
            background: #f0f0f0;
            border-color: #ddd;
        }
        .answer-inputs .answer-separator {
            font-size: 2rem;
            font-weight: 700;
            color: #1a2639;
            padding-bottom: 0.5rem;
            font-family: 'Montserrat', sans-serif;
        }

        .btn-check {
            background: #8D0B0D;
            color: #ffffff;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 6px 16px rgba(141,11,13,0.25);
            margin-top: 0.5rem;
        }
        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(141,11,13,0.35);
        }
        .btn-check:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .answer-result {
            margin-top: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            min-height: 2rem;
        }
        .answer-result.correct {
            color: #27ae60;
        }
        .answer-result.wrong {
            color: #c0392b;
        }
        .answer-result .correct-answer-show {
            color: #27ae60;
            font-weight: 700;
        }

        .btn-next {
            background: #FBC5D9;
            color: #000;
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }
        .btn-next:hover {
            background: #f5b2cc;
            transform: translateY(-2px);
        }
        .btn-next:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .finish-screen {
            text-align: center;
            padding: 2rem;
        }
        .finish-screen .big-score {
            font-family: 'Montserrat', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            color: #8D0B0D;
        }
        .finish-screen .big-score span {
            font-size: 1.5rem;
            font-weight: 400;
            color: #666;
        }
        .finish-screen .finish-text {
            font-size: 1.2rem;
            color: #333;
            margin: 0.5rem 0 1.5rem;
        }
        .btn-restart {
            background: #8D0B0D;
            color: #fff;
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 6px 16px rgba(141,11,13,0.25);
        }
        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(141,11,13,0.35);
        }

        .footer {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 0.85rem;
            border-top: 2px solid #FBC5D9;
            margin-top: 1rem;
            background: rgba(255, 255, 255, 0.5);
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            body { padding-top: 55px; }
            .navbar {
                padding: 0.4rem 1rem;
                min-height: 50px;
            }
            .nav-avatar {
                width: 36px;
                height: 36px;
            }
            .nav-title {
                font-size: 1.1rem;
            }
            .nav-title span {
                display: none;
            }

            .burger-btn {
                display: block;
            }

            .nav-menu {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: #ffffff;
                flex-direction: column;
                padding: 1rem;
                gap: 0.5rem;
                border-bottom: 3px solid #FBC5D9;
                box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            }
            .nav-menu.open {
                display: flex;
            }
            .nav-menu a {
                font-size: 0.9rem;
                padding: 0.5rem 0;
                width: 100%;
                text-align: center;
                border-bottom: 1px solid #f0ecea;
            }
            .nav-menu a:last-child {
                border-bottom: none;
            }

            .trainer-header h1 { font-size: 2rem; }
            .question-card { padding: 1.5rem; }
            .question-card .question-text { font-size: 1.8rem; }
            .answer-inputs .answer-field input { width: 70px; font-size: 1.2rem; }
        }

        @media (max-width: 480px) {
            body { padding-top: 48px; }
            .nav-title { font-size: 0.9rem; }
            .nav-avatar { width: 30px; height: 30px; }
            .burger-btn { font-size: 1.5rem; }

            .trainer-header h1 { font-size: 1.6rem; }
            .question-card .question-text { font-size: 1.4rem; }
            .answer-inputs .answer-field input { width: 55px; font-size: 1rem; }
            .answer-inputs .answer-separator { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- ===== ШАПКА С БУРГЕР-МЕНЮ ===== -->
    <nav class="navbar" id="navbar">
        <div class="nav-left">
            <img src="images/avatar.png" alt="Полина" class="nav-avatar" />
            <span class="nav-title">Математика <span>с Полиной</span></span>
        </div>

        <button class="burger-btn" id="burgerBtn" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
        </button>

        <div class="nav-menu" id="navMenu">
            <a href="index.html"><i class="fas fa-home"></i> Главная</a>
            <a href="tests.html"><i class="fas fa-tasks"></i> Тесты</a>
            <a href="materials.html" class="active"><i class="fas fa-folder-open"></i> Материалы</a>
            <a href="tutoring.html"><i class="fas fa-chalkboard-teacher"></i> Репетиторство</a>
            <a href="contacts.html"><i class="fas fa-envelope"></i> Контакты</a>
        </div>
    </nav>

    <div class="trainer-container" id="app">

        <div class="trainer-header">
            <h1>Действия с десятичными дробями</h1>
            <div class="subtitle">Сложение, вычитание, умножение, деление</div>
        </div>

        <div class="progress-section">
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="progress-text">
                <span>Прогресс</span>
                <span><span class="score-display" id="progressPercent">0</span>%</span>
            </div>
        </div>

        <div id="questionCard" class="question-card">
            <div class="question-number" id="questionNumberLabel">Вопрос 1 из 12</div>
            <div class="question-text" id="questionText"></div>
            <div class="answer-inputs">
                <div class="answer-field">
                    <label>Целая часть</label>
                    <input type="text" id="wholeInput" placeholder="0" />
                </div>
                <span class="answer-separator">,</span>
                <div class="answer-field">
                    <label>Дробная часть</label>
                    <input type="text" id="fracInput" placeholder="0" />
                </div>
            </div>
            <button class="btn-check" id="checkBtn" onclick="checkAnswer()">Проверить</button>
            <div class="answer-result" id="answerResult"></div>
        </div>

        <div style="text-align: center;">
            <button class="btn-next" id="nextBtn" onclick="nextQuestion()" disabled>
                <i class="fas fa-arrow-right"></i> Далее
            </button>
        </div>

        <div id="finishScreen" class="finish-screen" style="display:none;">
            <div class="big-score">
                <span id="finalScore">0</span> <span>из 12</span>
            </div>
            <div class="finish-text">🎉 Ты справился с тренажёром!</div>
            <button class="btn-restart" onclick="restartGame()">
                <i class="fas fa-redo"></i> Пройти ещё раз
            </button>
        </div>

    </div>

    <div class="footer">
        &copy; 2026 Математика с Полиной · Сделано с ❤️
    </div>

    <script>
        const TOTAL_QUESTIONS = 12;
        const ALL_EXAMPLES_COUNT = 100;

        let currentQuestions = [];
        let currentIndex = 0;
        let correctCount = 0;
        let answered = false;

        // ===== БУРГЕР-МЕНЮ =====
        function toggleMenu() {
            const menu = document.getElementById('navMenu');
            const burger = document.getElementById('burgerBtn');
            menu.classList.toggle('open');
            if (menu.classList.contains('open')) {
                burger.innerHTML = '<i class="fas fa-times"></i>';
            } else {
                burger.innerHTML = '<i class="fas fa-bars"></i>';
            }
        }

        document.querySelectorAll('#navMenu a').forEach(link => {
            link.addEventListener('click', function() {
                document.getElementById('navMenu').classList.remove('open');
                document.getElementById('burgerBtn').innerHTML = '<i class="fas fa-bars"></i>';
            });
        });

        document.addEventListener('click', function(event) {
            const navbar = document.getElementById('navbar');
            const menu = document.getElementById('navMenu');
            const burger = document.getElementById('burgerBtn');
            if (!navbar.contains(event.target)) {
                menu.classList.remove('open');
                burger.innerHTML = '<i class="fas fa-bars"></i>';
            }
        });

        // ===== ГЕНЕРАЦИЯ ДЕСЯТИЧНЫХ ДРОБЕЙ =====
        function generateDecimal(maxDigits, allowNegative = false) {
            const digits = Math.floor(Math.random() * maxDigits) + 1;
            let whole = Math.floor(Math.random() * 20) + 1;
            let frac = Math.floor(Math.random() * Math.pow(10, digits));
            let fracStr = String(frac).padStart(digits, '0');
            if (allowNegative && Math.random() < 0.3) {
                whole = -whole;
            }
            return {
                whole: whole,
                frac: fracStr,
                value: parseFloat(whole + '.' + fracStr)
            };
        }

        function getDecimalStr(whole, frac) {
            return whole + ',' + frac;
        }

        // ===== ГЕНЕРАЦИЯ ПРИМЕРОВ =====
        function generateAllExamples() {
            const examples = [];
            const operations = ['+', '−', '×', '÷'];
            const maxDigits = [1, 2, 3];

            for (let i = 0; i < ALL_EXAMPLES_COUNT * 3; i++) {
                const digits1 = maxDigits[Math.floor(Math.random() * maxDigits.length)];
                const digits2 = maxDigits[Math.floor(Math.random() * maxDigits.length)];

                let a = generateDecimal(digits1, true);
                let b = generateDecimal(digits2, false);

                if (b.value === 0) b.value = 1;

                const opIndex = Math.floor(Math.random() * operations.length);
                const op = operations[opIndex];

                let result, display;

                switch(op) {
                    case '+':
                        result = a.value + b.value;
                        display = `${getDecimalStr(a.whole, a.frac)} + ${getDecimalStr(b.whole, b.frac)}`;
                        break;
                    case '−':
                        if (a.value < b.value) {
                            [a, b] = [b, a];
                        }
                        result = a.value - b.value;
                        display = `${getDecimalStr(a.whole, a.frac)} − ${getDecimalStr(b.whole, b.frac)}`;
                        break;
                    case '×':
                        result = a.value * b.value;
                        display = `${getDecimalStr(a.whole, a.frac)} × ${getDecimalStr(b.whole, b.frac)}`;
                        break;
                    case '÷':
                        result = a.value / b.value;
                        result = Math.round(result * 1000) / 1000;
                        display = `${getDecimalStr(a.whole, a.frac)} ÷ ${getDecimalStr(b.whole, b.frac)}`;
                        break;
                }

                result = Math.round(result * 1000) / 1000;
                let resultStr = result.toFixed(3);
                resultStr = resultStr.replace(/\.?0+$/, '');
                let parts = resultStr.split('.');
                let resultWhole = parseInt(parts[0]) || 0;
                let resultFrac = parts[1] || '0';

                examples.push({
                    a: a,
                    b: b,
                    op: op,
                    display: display,
                    resultWhole: resultWhole,
                    resultFrac: resultFrac
                });

                if (examples.length >= ALL_EXAMPLES_COUNT) break;
            }
            return examples;
        }

        function selectRandomQuestions(allExamples) {
            const shuffled = [...allExamples];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled.slice(0, TOTAL_QUESTIONS);
        }

        function initGame() {
            const allExamples = generateAllExamples();
            currentQuestions = selectRandomQuestions(allExamples);
            currentIndex = 0;
            correctCount = 0;
            answered = false;

            document.getElementById('finishScreen').style.display = 'none';
            document.getElementById('questionCard').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'inline-flex';

            updateProgress();
            renderQuestion();
        }

        function updateProgress() {
            const percent = Math.round((correctCount / TOTAL_QUESTIONS) * 100);
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressPercent').textContent = percent;
        }

        function renderQuestion() {
            const q = currentQuestions[currentIndex];
            document.getElementById('questionNumberLabel').textContent = `Вопрос ${currentIndex + 1} из ${TOTAL_QUESTIONS}`;
            document.getElementById('questionText').innerHTML = q.display + ' = ?';

            document.getElementById('wholeInput').value = '';
            document.getElementById('fracInput').value = '';
            document.getElementById('wholeInput').disabled = false;
            document.getElementById('fracInput').disabled = false;

            document.getElementById('checkBtn').disabled = false;
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('answerResult').textContent = '';
            document.getElementById('answerResult').className = 'answer-result';

            answered = false;

            document.getElementById('wholeInput').focus();
        }

        function checkAnswer() {
            if (answered) return;

            const wholeInput = document.getElementById('wholeInput').value.trim();
            const fracInput = document.getElementById('fracInput').value.trim();

            if (wholeInput === '' || fracInput === '') {
                alert('Заполните оба поля!');
                return;
            }

            const userWhole = parseInt(wholeInput) || 0;
            const userFrac = fracInput;

            const q = currentQuestions[currentIndex];
            const correctWhole = q.resultWhole;
            const correctFrac = q.resultFrac;

            const resultDiv = document.getElementById('answerResult');

            const isCorrect = userWhole === correctWhole && userFrac === correctFrac;

            if (isCorrect) {
                resultDiv.textContent = '✅ Правильно!';
                resultDiv.className = 'answer-result correct';
                correctCount++;
                updateProgress();
            } else {
                resultDiv.innerHTML = `❌ Неправильно. Правильный ответ: <span class="correct-answer-show">${correctWhole},${correctFrac}</span>`;
                resultDiv.className = 'answer-result wrong';
            }

            answered = true;
            document.getElementById('wholeInput').disabled = true;
            document.getElementById('fracInput').disabled = true;
            document.getElementById('checkBtn').disabled = true;
            document.getElementById('nextBtn').disabled = false;

            if (currentIndex === TOTAL_QUESTIONS - 1) {
                document.getElementById('nextBtn').innerHTML = '<i class="fas fa-trophy"></i> Завершить';
            } else {
                document.getElementById('nextBtn').innerHTML = '<i class="fas fa-arrow-right"></i> Далее';
            }
        }

        function nextQuestion() {
            if (!answered) return;

            if (currentIndex === TOTAL_QUESTIONS - 1) {
                showFinish();
                return;
            }

            currentIndex++;
            renderQuestion();
        }

        function showFinish() {
            document.getElementById('questionCard').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('finishScreen').style.display = 'block';
            document.getElementById('finalScore').textContent = correctCount;

            const finishText = document.querySelector('.finish-text');
            if (correctCount === TOTAL_QUESTIONS) {
                finishText.textContent = '🌟 Идеально! Ты справился со всеми заданиями! 🌟';
            } else if (correctCount >= TOTAL_QUESTIONS * 0.7) {
                finishText.textContent = '🎉 Отличный результат! Продолжай в том же духе!';
            } else if (correctCount >= TOTAL_QUESTIONS * 0.4) {
                finishText.textContent = '💪 Хорошая попытка! Тренируйся ещё!';
            } else {
                finishText.textContent = '📚 Нужно ещё немного потренироваться. Попробуй снова!';
            }
        }

        function restartGame() {
            initGame();
            document.getElementById('app').scrollIntoView({ behavior: 'smooth' });
        }

        document.addEventListener('DOMContentLoaded', function() {
            initGame();

            document.getElementById('wholeInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    if (!answered) checkAnswer();
                    else nextQuestion();
                }
            });
            document.getElementById('fracInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    if (!answered) checkAnswer();
                    else nextQuestion();
                }
            });
        });
    </script>

</body>
